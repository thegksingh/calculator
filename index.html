<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <script src="script.js" defer></script>
</head>
<body>
    <div class="calculator-container">
        <div class="display">1234567890</div>
        <div class="keypad">
            <div class="row1">
                <button class="big-button" id="all-clear">AC</button>
                <button class="button" id="clear">C</button>
                <button class="button" id="addition">+</button>
            </div>
            <div class="row2">
                <button class="button digit" id="one">1</button>
                <button class="button digit" id="two">2</button>
                <button class="button digit" id="three">3</button>
                <button class="button operator" id="substraction">-</button>
            </div>
            <div class="row3">
                <button class="button digit" id="four">4</button>
                <button class="button digit" id="five">5</button>
                <button class="button digit" id="six">6</button>
                <button class="button operator" id="multiplication">*</button>
            </div>
            <div class="row4">
                <button class="button digit" id="seven">7</button>
                <button class="button digit" id="eight">8</button>
                <button class="button digit" id="nine">9</button>
                <button class="button operator" id="division">/</button>
            </div>
            <div class="row5">
                <button class="button" id="decimal">.</button>
                <button class="button digit" id="zero">0</button>
                <button class="big-button" id="equal-to">=</button>
            </div>
        </div>
    </div>
    
</body>
</html>
