<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="ui-section">

        <div class="text-section">
            <h1>CALCULATOR</h1>
            <p>This calculator is my solution to the final project in The Odin Project's Foundations curriculum. It is built entirely with Vanilla JavaScript, HTML, and CSS, featuring a custom math logic engine, dynamic DOM manipulation, and a responsive Flexbox layout.</p>
            <a href="https://github.com/thegksingh" target="_blank" rel="noopener noreferrer">
                <button class="github-link">
                    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                        <path fill="currentColor" d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/>
                    </svg>
                <span>GitHub</span>
                </button>
            </a>
        </div>

        <div class="calculator-container">
            <div class="display">1234567890</div>
            <div class="keypad">
                <div class="row1">
                    <button class="big-button" id="all-clear">AC</button>
                    <button class="button" id="clear">C</button>
                    <button class="button operator" id="addition">+</button>
                </div>
                <div class="row2">
                    <button class="button digit" id="one">1</button>
                    <button class="button digit" id="two">2</button>
                    <button class="button digit" id="three">3</button>
                    <button class="button operator" id="substraction">-</button>
                </div>
                <div class="row3">
                    <button class="button digit" id="four">4</button>
                    <button class="button digit" id="five">5</button>
                    <button class="button digit" id="six">6</button>
                    <button class="button operator" id="multiplication">*</button>
                </div>
                <div class="row4">
                    <button class="button digit" id="seven">7</button>
                    <button class="button digit" id="eight">8</button>
                    <button class="button digit" id="nine">9</button>
                    <button class="button operator" id="division">/</button>
                </div>
                <div class="row5">
                    <button class="button" id="decimal">.</button>
                    <button class="button digit" id="zero">0</button>
                    <button class="big-button" id="equal-to">=</button>
                </div>
            </div>
        </div>

    </div>
    
</body>
</html>
